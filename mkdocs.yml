site_name: Work Knowledge Handbook
site_url: https://nohdol97.github.io/work-handbook/
docs_dir: docs
site_dir: site
exclude_docs: |
  /README.md
  /adr/
  /specs/
  /proposals/
  /harness-changelog.md
theme:
  name: material
  language: ko
  features:
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      primary: indigo
      toggle:
        icon: material/brightness-auto
        name: 라이트 모드로 전환 / Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환 / Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 시스템 설정 사용 / Use system preference
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      languages:
        - locale: ko
          default: true
          name: 한국어
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            홈: Home
            방법론: Methodologies
            지식 관리: Knowledge workflow
            용어집: Glossary
            데이터 플랫폼: Data platform
