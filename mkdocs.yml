site_name: Work Knowledge Handbook
site_url: https://nohdol97.github.io/work-handbook/
docs_dir: docs
site_dir: site
exclude_docs: |
  /README.md
  /adr/
  /specs/
  /proposals/
  /harness-changelog.md
theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - content.code.copy
  palette:
    primary: indigo
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      languages:
        - locale: ko
          default: true
          name: 한국어
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            홈: Home
            방법론: Methodologies
            지식 관리: Knowledge workflow
            용어집: Glossary
nav:
  - 홈: index.md
  - 방법론:
      - 지식 관리: methodologies/knowledge-workflow.md
  - 용어집: glossary/index.md
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
