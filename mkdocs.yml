site_name: Work Knowledge Handbook
site_url: https://nohdol97.github.io/work-handbook/
docs_dir: docs
site_dir: site
exclude_docs: |
  /README.md
  /adr/
  /specs/
  /proposals/
  /harness-changelog.md
theme:
  name: material
  language: ko
  features:
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      primary: indigo
      toggle:
        icon: material/brightness-auto
        name: 라이트 모드로 전환 / Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환 / Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 시스템 설정 사용 / Use system preference
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      languages:
        - locale: ko
          default: true
          name: 한국어
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            홈: Home
            방법론: Methodologies
            지식 관리: Knowledge workflow
            용어집: Glossary
            데이터 플랫폼: Data platform
            플랫폼·인프라: Platform and infrastructure
            학습 범위: Study scope
            Linux·컨테이너: Linux and containers
            Kubernetes 핵심: Kubernetes core
            Kubernetes 운영: Kubernetes operations
            Kafka 운영: Kafka operations
            GPU 인프라·스케줄링: GPU infrastructure and scheduling
            플랫폼 보안: Platform security
            CI/CD·GitOps: CI/CD and GitOps
            실무 프롬프트: Practical prompts
            프롬프트 모음: Prompt library
            저장·분석 기초: Storage and analytics
            계보·메타데이터: Lineage and metadata
            전체 구조: Architecture
            학습 범위와 완료 현황: Study scope and completion
            저장과 분석 기초: Storage and analytics foundations
            이벤트 아키텍처: Event architecture
            Lakehouse와 Iceberg: Lakehouse and Iceberg
            Spark: Spark
            Flink: Flink
            CDC와 Debezium: CDC and Debezium
            Orchestration: Orchestration
            dbt: dbt
            분석 모델링: Analytical modeling
            Trino: Trino
            데이터 품질: Data quality
            데이터 관측: Data observability
            계보와 메타데이터: Lineage and metadata
            거버넌스: Governance
            AI-ready 데이터: AI-ready data
            온라인 AI 평가: Online AI evaluation
            AI 평가 플랫폼: AI evaluation platform
            플랫폼 비교: Platform comparison
            운영·복구: Production operations
nav:
  - 홈: index.md
  - 방법론:
      - 지식 관리: methodologies/knowledge-workflow.md
  - 데이터 플랫폼:
      - 전체 구조: data-platform/architecture.md
      - 학습 범위와 완료 현황: data-platform/curriculum.md
      - 저장과 분석 기초: data-platform/foundations.md
      - 이벤트 아키텍처: data-platform/event-architecture.md
      - Lakehouse와 Iceberg: data-platform/lakehouse-iceberg.md
      - Spark: data-platform/spark.md
      - Flink: data-platform/flink.md
      - CDC와 Debezium: data-platform/cdc-debezium.md
      - Orchestration: data-platform/orchestration.md
      - dbt: data-platform/dbt.md
      - 분석 모델링: data-platform/analytical-modeling.md
      - Trino: data-platform/trino.md
      - 데이터 품질: data-platform/data-quality.md
      - 데이터 관측: data-platform/data-observability.md
      - 계보와 메타데이터: data-platform/lineage-metadata.md
      - 거버넌스: data-platform/governance.md
      - AI-ready 데이터: data-platform/ai-ready-data.md
      - AI 평가 플랫폼: data-platform/ai-evaluation.md
      - Databricks: data-platform/databricks.md
      - Snowflake: data-platform/snowflake.md
      - 플랫폼 비교: data-platform/platform-comparison.md
      - 운영·복구: data-platform/production-operations.md
  - 플랫폼·인프라:
      - 학습 범위: platform-infrastructure/index.md
      - Linux·컨테이너: platform-infrastructure/linux-containers.md
      - Kubernetes 핵심: platform-infrastructure/kubernetes-core.md
      - Kubernetes 운영: platform-infrastructure/kubernetes-operations.md
      - Redis: platform-infrastructure/redis.md
      - PostgreSQL: platform-infrastructure/postgresql.md
      - Kafka 운영: platform-infrastructure/kafka.md
      - vLLM: platform-infrastructure/vllm.md
      - LiteLLM: platform-infrastructure/litellm.md
      - GPU 인프라·스케줄링: platform-infrastructure/gpu-infrastructure.md
      - 플랫폼 보안: platform-infrastructure/platform-security.md
      - CI/CD·GitOps: platform-infrastructure/cicd-gitops.md
  - 실무 프롬프트:
      - 프롬프트 모음: prompts/index.md
      - 저장·분석 기초: prompts/foundations.md
      - 이벤트 아키텍처: prompts/event-architecture.md
      - Lakehouse / Iceberg: prompts/lakehouse-iceberg.md
      - Spark: prompts/spark.md
      - Flink: prompts/flink.md
      - CDC / Debezium: prompts/cdc-debezium.md
      - Orchestration: prompts/orchestration.md
      - dbt: prompts/dbt.md
      - 분석 모델링: prompts/analytical-modeling.md
      - Trino: prompts/trino.md
      - 데이터 품질: prompts/data-quality.md
      - 데이터 관측: prompts/data-observability.md
      - 계보·메타데이터: prompts/lineage-metadata.md
      - 거버넌스: prompts/governance.md
      - AI-ready 데이터: prompts/ai-ready-data.md
      - 온라인 AI 평가: prompts/online-evaluation.md
      - 지식 관리: prompts/knowledge-workflow.md
  - 용어집: glossary/index.md
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - assets/stylesheets/prompts.css
  - assets/stylesheets/theme.css
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
